<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আইসিটি প্রতিযোগিতা ও কুইজ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #1e1e1e;
      color: #ffffff;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .dark-mode .card {
      background: #2d2d2d;
      color: white;
    }
    button {
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <button onclick="toggleDarkMode()" style="background:#333; color:white; padding:8px 15px; border:none; border-radius:5px;">🌙 Dark/Light Mode</button>
    <p id="live-clock" style="font-weight:bold; margin-top:10px; color:#007bff;"></p>
  </div>

  <div class="card">
    <h2>🔊 ভয়েস রিডার (Text-to-Speech)</h2>
    <p id="speech-text">আইসিটি প্রতিযোগিতায় আপনাকে স্বাগতম! আমাদের ওয়েবসাইটে বিষয়ভিত্তিক কুইজ এবং আধুনিক তথ্যপ্রযুক্তির ফিচার রয়েছে।</p>
    <button onclick="readText()" style="background:#28a745; color:white; padding:8px 15px; border:none; border-radius:5px;">পড়ে শোনাও 🗣️</button>
  </div>

  <div class="card" id="quiz-section">
    <h2>🧠 বিষয়ভিত্তিক আইসিটি কুইজ প্রতিযোগিতা</h2>
    
    <label for="quiz-subject"><b>বিষয় নির্বাচন করুন:</b></label><br>
    <select id="quiz-subject" onchange="loadQuiz()" style="padding: 8px; margin: 10px 0; border-radius: 5px; width: 100%; max-width: 300px;">
      <option value="hardware">১. কম্পিউটার হার্ডওয়্যার</option>
      <option value="network">২. নেটওয়ার্ক ও ইন্টারনেট</option>
      <option value="cyber">৩. সাইবার নিরাপত্তা</option>
    </select>

    <div id="quiz-box">
      </div>

    <button onclick="checkAnswer()" style="background:#007bff; color:white; padding:8px 15px; border:none; border-radius:5px; margin-top:10px;">উত্তর জমা দিন</button>
    <p id="quiz-result" style="font-weight:bold; margin-top:10px;"></p>
  </div>

  <footer style="text-align:center; padding:15px; margin-top:20px;">
    <button onclick="scrollToTop()" style="background:#ff4757; color:white; padding:8px 15px; border:none; border-radius:5px;">⬆️ ওপরে যান</button>
  </footer>

  <script>
    // ডার্ক মোড
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    // লাইভ ঘড়ি
    function updateClock() {
      const now = new Date();
      const elem = document.getElementById("live-clock");
      if(elem) elem.innerText = "⏰ " + now.toLocaleTimeString() + " | " + now.toLocaleDateString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ভয়েস রিডার
    function readText() {
      window.speechSynthesis.cancel();
      const txt = document.getElementById("speech-text").innerText;
      const uttr = new SpeechSynthesisUtterance(txt);
      uttr.lang = "bn-BD";
      window.speechSynthesis.speak(uttr);
    }

    // বিষয়ভিত্তিক প্রশ্নাবলী
    const quizData = {
      hardware: [
        {
          q: "সিপিইউ (CPU)-এর পূর্ণরূপ কী?",
          options: ["Central Process Unit", "Central Processing Unit", "Computer Processing Unit"],
          ans: 1
        },
        {
          q: "নিচের কোনটি কম্পিউটারের স্থায়ী মেমোরি?",
          options: ["RAM", "ROM", "Cache"],
          ans: 1
        }
      ],
      network: [
        {
          q: "ইন্টারনেট ব্যবহারের জন্য কোনটি অবশ্য প্রয়োজনীয়?",
          options: ["IP Address", "Pen Drive", "Printer"],
          ans: 0
        },
        {
          q: "www-এর পূর্ণরূপ কী?",
          options: ["World Wide Web", "World Whole Web", "Web World Wide"],
          ans: 0
        }
      ],
      cyber: [
        {
          q: "পাসওয়ার্ড সুরক্ষিত রাখার সবচেয়ে ভালো উপায় কোনটি?",
          options: ["সবার সাথে শেয়ার করা", "সহজ নাম্বার দেওয়া", "স্ট্রং ও গোপন রাখা"],
          ans: 2
        }
      ]
    };

    // কুইজ লোড করার ফাংশন
    function loadQuiz() {
      const subject = document.getElementById("quiz-subject").value;
      const questions = quizData[subject];
      let html = "";

      questions.forEach((qObj, index) => {
        html += `<div style="text-align: left; margin-bottom: 15px; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 5px;">`;
        html += `<p><b>${index + 1}. ${qObj.q}</b></p>`;
        qObj.options.forEach((opt, optIndex) => {
          html += `<label style="display:block; margin: 4px 0;"><input type="radio" name="q_${index}" value="${optIndex}"> ${opt}</label>`;
        });
        html += `</div>`;
      });

      document.getElementById("quiz-box").innerHTML = html;
      document.getElementById("quiz-result").innerHTML = "";
    }

    // উত্তর চেক করার ফাংশন
    function checkAnswer() {
      const subject = document.getElementById("quiz-subject").value;
      const questions = quizData[subject];
      let score = 0;
      let total = questions.length;
      let answeredAll = true;

      questions.forEach((qObj, index) => {
        const options = document.getElementsByName(`q_${index}`);
        let selected = -1;
        for (let i = 0; i < options.length; i++) {
          if (options[i].checked) {
            selected = parseInt(options[i].value);
            break;
          }
        }

        if (selected === -1) {
          answeredAll = false;
        } else if (selected === qObj.ans) {
          score++;
        }
      });

      const resElem = document.getElementById("quiz-result");
      if (!answeredAll) {
        alert("দয়া করে সবগুলো প্রশ্নের উত্তর দিন!");
        return;
      }

      resElem.innerHTML = `<span style="color: green;">🎉 চমৎকার! আপনি ${total}-টির মধ্যে ${score}-টি সঠিক উত্তর দিয়েছেন।</span>`;
    }

    // ওপরে যাওয়ার ফাংশন
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // প্রথমবার অটোমেটিক কুইজ লোড
    window.onload = function() {
      loadQuiz();
    };
  </script>
</body>
</html>
