<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার ওয়েবসাইট</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🌐 আমার ওয়েবসাইট</h1>

<nav>
<a href="#home">হোম</a>
<a href="#video">ভিডিও</a>
<a href="#movie">মুভি</a>
<a href="#shop">শপ</a>
</nav>

</header>

<div class="container">

<div class="card" id="home">
<h2>স্বাগতম!</h2>
<p>এটি আমার ব্যক্তিগত ওয়েবসাইট।</p>
</div>

<div class="card" id="video">
<h2>📺 ভিডিও</h2>

<iframe width="100%" height="220"
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
allowfullscreen>
</iframe>

</div>

<div class="card" id="movie">
<h2>🎬 মুভি</h2>

<p>নিচের বাটনে চাপুন</p>

<a href="https://www.youtube.com" target="_blank">
<button>মুভি দেখুন</button>
</a>

</div>

<div class="card" id="shop">
<h2>🛒 অনলাইন শপ</h2>

<a href="https://www.daraz.com.bd" target="_blank">
<button>Daraz</button>
</a>

<br><br>

<a href="https://www.amazon.com" target="_blank">
<button>Amazon</button>
</a>

</div>

</div>

<div class="card">
<h2>🤖 AI Assistant</h2>

<input type="text" id="prompt" placeholder="আপনার প্রশ্ন লিখুন">
<button onclick="askAI()">জিজ্ঞাসা করুন</button>

<p id="answer"></p>
</div>

<script>
async function askAI() {
  const prompt = document.getElementById("prompt").value;

  const res = await fetch("https://wp-ai.nazari1715.workers.dev/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ prompt })
  });

  const data = await res.text();
  document.getElementById("answer").innerText = data;
}
</script>
</body>
</html>
