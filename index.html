<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডভান্সড আইসিটি অলিম্পিয়াড ও এআই চ্যাটবট</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f4f7f6;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .dark-mode .card {
      background: #1e1e1e;
      color: white;
    }
    button {
      cursor: pointer;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      transition: 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    select, input[type="text"] {
      font-size: 15px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .q-box {
      text-align: left;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.03);
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #007bff;
    }
    .dark-mode .q-box {
      background: rgba(255,255,255,0.05);
    }
    #chat-box {
      height: 250px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 10px;
      text-align: left;
    }
    .dark-mode #chat-box {
      background: #2a2a2a;
      border-color: #444;
    }
    .chat-msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .user-msg {
      background: #007bff;
      color: white;
      margin-left: auto;
      text-align: right;
    }
    .bot-msg {
      background: #e9ecef;
      color: #333
